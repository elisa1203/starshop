    </div>
    
   
  

<script>
async function loadProductsFrom(page) {
  const res = await fetch(page);
  const text = await res.text();

  // HTML を仮の DOM として読み込む
  const parser = new DOMParser();
  const doc = parser.parseFromString(text, "text/html");

  // 商品を全部取得
  return [...doc.querySelectorAll(".clothes-item")];
}

async function loadAllProducts() {
  const pages = ["tops-tshirt.html", "tops-knit.html", "tops-hoodie.html", "tops-jacket.html"];
  let allProducts = [];

  for (const page of pages) {
    const items = await loadProductsFrom(page);
    allProducts.push(...items);
  }

  return allProducts;
}

loadAllProducts().then(products => {
  const today = new Date();
  const container = document.querySelector(".new-arrivals");

  products.forEach(item => {
    const added = new Date(item.dataset.added);
    const diff = (today - added) / (1000 * 60 * 60 * 24);

    if (diff <= 7) {
      container.appendChild(item.cloneNode(true));
    }
  });
});
 
const toggleBtn = document.querySelector(".sidebar-toggle");
const sidebar = document.querySelector(".sidebar");

toggleBtn.addEventListener("click", () => {
  sidebar.classList.toggle("active");
  toggleBtn.classList.toggle("active");
   if (sidebar.classList.contains("active")) {
    toggleBtn.textContent = "→";  // 開いたら → に
  } else {
    toggleBtn.textContent = "←";  // 閉じたら ← に
  }
});

  const products = [
  { name: "olivegreen jacket", genre: "tops" },
  { name: "babypink adidads jacket", genre: "tops" },
  { name: "", genre: "accessories" },
  { name: "スニーカー", genre: "shoes" },
  { name: "黒いTシャツ", genre: "tops" },
  { name: "ロングスカート", genre: "bottoms" }
];

const genreButtons = document.querySelectorAll(".genre-list button");
const productList = document.getElementById("product-list");

genreButtons.forEach(btn => {
  btn.addEventListener("click", () => {
    const genre = btn.dataset.genre;

    // 絞り込み
    const filtered = products.filter(item => item.genre === genre);

    // 表示
    productList.innerHTML = filtered
      .map(item => `<div class="product-item">${item.name}</div>`)
      .join("");
  });
});

document.querySelectorAll(".has-sub").forEach(btn => {
  btn.addEventListener("click", () => {
    const targetId = btn.dataset.target;
    const subMenu = document.getElementById(targetId);

    if (subMenu.style.display === "block") {
      subMenu.style.display = "none";
    } else {
      subMenu.style.display = "block";
    }
  });
});

</script>
