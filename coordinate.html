<!-- coordinate.html -->
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>コーデを作る</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
    
 <h2>コーデを作る</h2>
 

<div class="coordinate-wrapper">

  <!-- キャンバス -->
  <div id="coordinate-area"></div>
  
  <!-- ジャンル選択 -->
  <div class="item-panel">

    <div class="genre-buttons">
      <button data-genre="tops">トップス</button>
      <button data-genre="bottoms">ボトムス</button>
      <button data-genre="bags">バッグ</button>
    <button data-genre="accessories">アクセサリー</button>
    <button data-genre="shoes">シューズ</button>
    <button data-genre="kimono">着物</button>
     <button data-genre="obi">帯</button>
    </div>
    

    <!-- 商品リスト -->
    <div class="item-list">

      <div class="genre-items" id="tops">
        <img src="adidas-pink-jacket.png" data-slot="top">
        <img src="green-jacket.png" data-slot="top">
       <img src="purple-border-vknit.png" data-slot="top">
      <img src="pink-kawaii-winter-top.png" data-slot="top"> 
          <img src="pink-v-t.png" data-slot="top"> 
      </div>

      <div class="genre-items" id="bottoms" style="display:none;">
        <img src="ribbon-flare.png" data-slot="bottom">
      </div>

      <div class="genre-items" id="bags" style="display:none;">
        <img src="camo-bag.png" data-slot="bag">
         <img src="pink-dot-bag.png" data-slot="bag">
      </div>
      
　　<div class="genre-items" id="accessories" style="display:none;">
        <img src="necklace-removebg-preview.png" data-slot="accessories">
         <img src="layer-egg-necklace.png" data-slot="accessories">
      </div>
      
      <div class="genre-items" id="shoes" style="display:none;">
         <img src="green-sandals.png" data-slot="shoes">
         <img src="blue-snake-sandals.png" data-slot="shoes">
      </div>
      
        <div class="genre-items" id="kimono" style="display:none;">
         <img src="black-kimono.png" data-slot="kimono">
      </div>

      <div class="genre-items" id="obi" style="display:none;">
         <img src="pink-white-obi.png" data-slot="obi">
      </div>
      
    </div>

  </div>
  
  </div>


   <button id="save-btn">保存</button>
   
 



<div class="bg-colors">
<button data-pattern="dot">🫧</button>
<button data-pattern="star">✩</button>
  <button data-color="#ff0000">❤️</button>
  <button data-color="#ff66b2">🩷</button>
  <button data-color="#ff9900">🧡</button>
  <button data-color="#ffeb3b">💛</button>
  <button data-color="#4caf50">💚</button>
  <button data-color="#66ccff">🩵</button>
  <button data-color="#2196f3">💙</button>
  <button data-color="#9c27b0">💜</button>
  <button data-color="#000000">🖤</button>
  <button data-color="#ffffff">🤍</button>
</div>

   <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<script>

/* ✅ 背景色ボタン（色だけ変える） */
document.querySelectorAll("[data-color]").forEach(btn => {
  btn.addEventListener("click", () => {
    const area = document.getElementById("coordinate-area");

    // ✅ 背景色だけ変える（柄は消さない）
    area.style.backgroundColor = btn.getAttribute("data-color");
  });
});

/* ✅ パターンボタン（柄だけ変える） */
document.querySelectorAll("[data-pattern]").forEach(btn => {
  btn.addEventListener("click", () => {
    const area = document.getElementById("coordinate-area");
    const pattern = btn.getAttribute("data-pattern");

    // ✅ 柄だけ切り替える（背景色は残す）
    area.classList.remove("bg-dot", "bg-star");

    if (pattern === "dot") area.classList.add("bg-dot");
    if (pattern === "star") area.classList.add("bg-star");
  });
});

/* ✅ 保存機能（背景色＋柄をそのまま保存） */
document.getElementById("save-btn").addEventListener("click", function() {
  const target = document.getElementById("coordinate-area");

  // ✅ UIを隠す（削除ボタン・リサイズハンドル）
  const uiButtons = document.querySelectorAll(".delete-btn, .resize-handle");
  uiButtons.forEach(btn => btn.classList.add("hide-ui"));

  html2canvas(target, {
    scale: 2,
    backgroundColor: null,  // ✅ 背景色＋柄をそのまま保存
    useCORS: true,
    allowTaint: true,       // ✅ 柄（gradient）を確実に描画
    imageTimeout: 0
  }).then(canvas => {

    // ✅ UIを戻す
    uiButtons.forEach(btn => btn.classList.remove("hide-ui"));

    // ✅ 保存
    const link = document.createElement("a");
    link.download = "coordinate.png";
    link.href = canvas.toDataURL("image/png");
    link.click();
  });
});

</script>

<script>
/* --- ジャンル切り替え --- */
document.querySelectorAll(".genre-buttons button").forEach(btn => {
  btn.addEventListener("click", () => {
    const genre = btn.dataset.genre;

    document.querySelectorAll(".genre-items").forEach(g => g.style.display = "none");
    document.getElementById(genre).style.display = "block";
  });
});

/* --- 商品クリックでキャンバスに配置 --- */
document.querySelectorAll(".genre-items img").forEach(img => {
  img.addEventListener("click", () => {
    const slot = img.dataset.slot;
    placeItemInSlot(img.src, slot);
  });
});

/* --- キャンバスにアイテムを配置（完成版） --- */
function placeItemInSlot(src, slot) {
  const area = document.getElementById("coordinate-area");

  // ✅ wrapper（画像＋削除＋リサイズ）
  const wrapper = document.createElement("div");
  wrapper.classList.add("placed-wrapper");
  wrapper.style.position = "absolute";
  wrapper.style.zIndex = "2000";

  // ✅ 画像
  const img = document.createElement("img");
  img.src = src;
  img.classList.add("placed-item");
  img.style.position = "absolute";
  img.style.zIndex = "2001";
  if (slot === "bag") {
  img.style.width = "150px";
} else if (slot === "kimono") {
  img.style.width = "600px";
} else if (slot === "obi") {
  img.style.width = "200px";
} else {
  img.style.width = "250px";
}


  // ✅ 削除ボタン（左上）
  const del = document.createElement("button");
  del.classList.add("delete-btn");
  del.textContent = "×";
  del.style.zIndex = "2002";
  del.addEventListener("click", () => wrapper.remove());

  // ✅ リサイズハンドル（右下）
  const handle = document.createElement("div");
  handle.classList.add("resize-handle");
  handle.style.zIndex = "2002";
   handle.textContent = "↖️";   // ← これを追加！

  // ✅ wrapper に追加
  wrapper.appendChild(img);
  wrapper.appendChild(del);
  wrapper.appendChild(handle);
  area.appendChild(wrapper);

  // ✅ 初期位置
  const positions = {
    top:   { left: "50%", top: "10%" },
    bottom:{ left: "50%", top: "60%" },
    bag:   { left: "80%", top: "40%" },
    accessories: {left: "60%", top: "40%" },
     shoes: {left: "40%", top: "80%" }, 
     kimono: {left: "5%", top: "5%"}, 
    obi: {left: "10%", top: "50%" } 
  };

  const pos = positions[slot];
  wrapper.style.left = pos.left;
  wrapper.style.top = pos.top;
  wrapper.style.transform = "translate(-50%, -50%)";

  // ✅ 機能を適用
  enableDrag(wrapper);
  enableResize(wrapper, img, handle);
}

/* --- ドラッグ機能（完成版） --- */
function enableDrag(wrapper) {
  let isDragging = false;
  let offsetX = 0;
  let offsetY = 0;

  wrapper.addEventListener("mousedown", startDrag);
  wrapper.addEventListener("touchstart", startDrag);

  function startDrag(e) {
    e.preventDefault();
    isDragging = true;

    const rect = wrapper.getBoundingClientRect();
    const x = e.touches ? e.touches[0].clientX : e.clientX;
    const y = e.touches ? e.touches[0].clientY : e.clientY;

    offsetX = x - rect.left;
    offsetY = y - rect.top;

    document.addEventListener("mousemove", move);
    document.addEventListener("mouseup", endDrag);
    document.addEventListener("touchmove", move);
    document.addEventListener("touchend", endDrag);
  }

  function move(e) {
    if (!isDragging) return;

    const area = document.getElementById("coordinate-area");
    const rect = area.getBoundingClientRect();

    const x = e.touches ? e.touches[0].clientX : e.clientX;
    const y = e.touches ? e.touches[0].clientY : e.clientY;

    wrapper.style.left = (x - rect.left - offsetX) + "px";
    wrapper.style.top = (y - rect.top - offsetY) + "px";
    wrapper.style.transform = "none";
  }

  function endDrag() {
    isDragging = false;
    document.removeEventListener("mousemove", move);
    document.removeEventListener("mouseup", endDrag);
    document.removeEventListener("touchmove", move);
    document.removeEventListener("touchend", endDrag);
  }
}

/* --- リサイズ機能（完成版） --- */
function enableResize(wrapper, img, handle) {
  let startX, startY, startSize;

  handle.addEventListener("mousedown", startResize);
  handle.addEventListener("touchstart", startResize);

  function startResize(e) {
    e.preventDefault();

    startX = e.touches ? e.touches[0].clientX : e.clientX;
    startY = e.touches ? e.touches[0].clientY : e.clientY;

    // ✅ 基準サイズ（幅を基準にする）
    startSize = img.offsetWidth;

    document.addEventListener("mousemove", resize);
    document.addEventListener("mouseup", stopResize);
    document.addEventListener("touchmove", resize);
    document.addEventListener("touchend", stopResize);
  }

  function resize(e) {
    const x = e.touches ? e.touches[0].clientX : e.clientX;
    const y = e.touches ? e.touches[0].clientY : e.clientY;

    // ✅ ハンドルの移動距離（斜め方向も含む）
    const diffX = x - startX;
    const diffY = y - startY;

    // ✅ 斜め方向の距離を合成（ピタゴラス）
    const distance = Math.sqrt(diffX * diffX + diffY * diffY);

    // ✅ 上方向に動かしたら大きく、下方向なら小さく
    const direction = diffY < 0 ? 1 : -1;

    // ✅ 新しいサイズ
    const newSize = startSize + distance * direction;

    // ✅ 最小サイズの制限
    if (newSize > 30) {
      img.style.width = newSize + "px";
      img.style.height = "auto"; // 比率維持
    }
  }

  function stopResize() {
    document.removeEventListener("mousemove", resize);
    document.removeEventListener("mouseup", stopResize);
    document.removeEventListener("touchmove", resize);
    document.removeEventListener("touchend", stopResize);
  }
}





</script>








<!-- 保存処理 -->







</body>
</html>
