  <script>
    const toggleBtn = document.querySelector(".sidebar-toggle");
const sidebar = document.querySelector(".sidebar");

toggleBtn.addEventListener("click", () => {
  sidebar.classList.toggle("active");
  toggleBtn.classList.toggle("active");
   if (sidebar.classList.contains("active")) {
    toggleBtn.textContent = "→";  // 開いたら → に
  } else {
    toggleBtn.textContent = "←";  // 閉じたら ← に
  }
});

  const products = [
  { name: "olivegreen jacket", genre: "tops" },
  { name: "babypink adidads jacket", genre: "tops" },
  { name: "", genre: "accessories" },
  { name: "スニーカー", genre: "shoes" },
  { name: "黒いTシャツ", genre: "tops" },
  { name: "ロングスカート", genre: "bottoms" }
];

const genreButtons = document.querySelectorAll(".genre-list button");
const productList = document.getElementById("product-list");

genreButtons.forEach(btn => {
  btn.addEventListener("click", () => {
    const genre = btn.dataset.genre;

    // 絞り込み
    const filtered = products.filter(item => item.genre === genre);

    // 表示
    productList.innerHTML = filtered
      .map(item => `<div class="product-item">${item.name}</div>`)
      .join("");
  });
});

document.querySelectorAll(".has-sub").forEach(btn => {
  btn.addEventListener("click", () => {
    const targetId = btn.dataset.target;
    const subMenu = document.getElementById(targetId);

    if (subMenu.style.display === "block") {
      subMenu.style.display = "none";
    } else {
      subMenu.style.display = "block";
    }
  });
});
</script>
